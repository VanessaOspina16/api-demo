<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Tecnología</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <div class="container">
    <h1>🖥️ Tienda de Tecnología</h1>

    <!-- Mensajes de éxito o error -->
    <div id="mensaje" class="mensaje oculto"></div>

    <!-- Formulario para agregar producto -->
    <div class="card">
      <h2>Agregar Producto</h2>
      <div class="formulario">
        <input type="text" id="nombre" placeholder="Nombre del producto">
        <input type="number" id="precio" placeholder="Precio">
        <button id="btnAgregar">Agregar Producto</button>
      </div>
      <div id="errorFormulario" class="error oculto"></div>
    </div>

    <!-- Tabla de productos -->
    <div class="card">
      <h2>Catálogo de Productos</h2>
      <div id="cargando" class="cargando">Cargando productos...</div>
      <table id="tablaProductos" class="oculto">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Disponible</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
