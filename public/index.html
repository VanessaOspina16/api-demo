<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Tecnología</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="container">

    <header>
      <h1>⚡ TechStore</h1>
      <p>Panel de gestión de inventario</p>
    </header>

    <div id="mensaje" class="oculto"></div>

    <div class="card">
      <h2>➕ Nuevo Producto</h2>
      <div class="formulario">
        <input type="text" id="nombre" placeholder="Nombre del producto">
        <input type="number" id="precio" placeholder="Precio en pesos">
        <button id="btnAgregar">Agregar</button>
      </div>
      <div id="errorFormulario" class="error oculto"></div>
    </div>

    <div class="card">
      <h2>📦 Catálogo</h2>
      <div id="cargando" class="cargando">Cargando productos...</div>
      <table id="tablaProductos" class="oculto">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
    </div>

  </div>
  <script src="assets/app.js"></script>
</body>
</html>
